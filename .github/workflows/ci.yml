name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pest_inspection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pest_inspection_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/pest_inspection_test
      REDIS_URL: redis://localhost:6379
      COMMUNICATION_PROVIDER: disabled
      AUTH_URL: https://ci.example.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate ephemeral CI secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "FUNNEL_CAPABILITY_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_IDENTIFIER_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "COMMUNICATION_TEST_WEBHOOK_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "COMMUNICATION_JOB_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Apply and validate PostgreSQL migrations
        run: |
          npm run db:deploy
          npm run db:status
          npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Repository whitespace check
        run: git diff --check

      - name: Unit and integration tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: PostgreSQL, Redis, homeowner, and dashboard browser tests
        run: npm run test:e2e

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
